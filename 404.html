<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TuCanciónQR · Una canción con su nombre en 2 minutos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F7F8FA; color: #111318; font-family: 'DM Sans', sans-serif;
      min-height: 100dvh; display: grid; place-items: center; padding: 20px;
    }
    .card {
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 24px;
      max-width: 440px; width: 100%; padding: 32px 24px; text-align: center;
      box-shadow: 0 22px 54px -24px rgba(17, 19, 24, 0.14);
    }
    .card img { width: 52px; height: 52px; margin: 0 auto 16px; display: block; }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.55rem; margin-bottom: 10px; }
    p { color: #4B5563; font-size: 15px; line-height: 1.55; margin-bottom: 22px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 48px;
      border-radius: 999px; background: #E11D48; color: #FFFFFF; text-decoration: none;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px;
    }
    .btn:hover { background: #BE123C; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/favicon.svg" alt="TuCanciónQR" />
    <h1>Este enlace ha caducado o no existe</h1>
    <p>Si quieres crear una canción personalizada con su nombre, mini-web interactiva y código QR en 2 minutos, entra en la portada oficial.</p>
    <a href="/" class="btn">Crear canción ahora</a>
  </main>
</body>
</html>
