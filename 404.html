<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiWebLocal.com · Tu web profesional en 15 segundos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function () {
      var path = window.location.pathname || '/';
      try {
        var raw = localStorage.getItem('miweblocal_platform_v5');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.name) {
            var slug = String(parsed.name)
              .toLowerCase()
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
            var clean = path.replace(/^\/+|\/+$/g, '').toLowerCase();
            if (slug && clean === slug) {
              window.location.replace('/sitio/?negocio=' + encodeURIComponent(slug));
              return;
            }
            if (slug && (clean === slug + '/admin' || clean === 'admin/' + slug)) {
              window.location.replace('/admin/?negocio=' + encodeURIComponent(slug));
              return;
            }
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAFBFD;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 28px;
      max-width: 460px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 60px -24px rgba(15, 23, 42, 0.14);
    }
    .mark {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      margin: 0 auto 18px;
      display: block;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    p {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 22px;
      border-radius: 999px;
      background: #4F46E5;
      color: #FFFFFF;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.96rem;
      box-shadow: 0 12px 28px -8px rgba(79, 70, 229, 0.45);
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1), background 0.2s ease;
    }
    .btn:hover { background: #4338CA; transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <main class="card">
    <img src="/favicon.svg" alt="MiWebLocal" class="mark" />
    <h1>Esta dirección no está activa</h1>
    <p>Si buscas crear o ver la página web de tu negocio en 15 segundos con pago único y sin cuotas mensuales, entra en la portada oficial de <strong>MiWebLocal.com</strong>.</p>
    <a href="/" class="btn">Ir a MiWebLocal.com →</a>
  </main>
</body>
</html>
