# ═════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE PRODUCCIÓN NGINX - ORERO MOTORCYCLES
# Dominio Oficial: https://oreromotorcycles.es/
# ═════════════════════════════════════════════════════════════════

# 1. Redirección HTTP (Puerto 80) a HTTPS (Puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name oreromotorcycles.es www.oreromotorcycles.es;

    return 301 https://oreromotorcycles.es$request_uri;
}

# 2. Servidor Seguro HTTPS (Puerto 443) con SSL/TLS y HTTP/2
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oreromotorcycles.es;

    # Certificados SSL Let's Encrypt / Cloudflare Origin
    ssl_certificate /etc/letsencrypt/live/oreromotorcycles.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oreromotorcycles.es/privkey.pem;

    # Protocolos y Cifrados Criptográficos Seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de Seguridad y HSTS Preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    root /var/www/oreromotorcycles.es;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        try_files $uri $uri.html /admin.html;
    }

    # API Proxy a Node.js Backend si se ejecuta localmente
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Activos estáticos con caché agresivo
    location ~* \.(jpg|jpeg|png|webp|svg|gif|ico|woff2|woff|ttf|glb|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
