<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 68" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="hlGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="hlShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    <linearGradient id="hlRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="hlShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Crest Emblem (Left) -->
  <g transform="translate(4, 2)" filter="url(#hlShadow)">
    <circle cx="32" cy="32" r="31" fill="#0A1128" stroke="url(#hlRing)" stroke-width="2.2" />
    <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="0.8" />

    <!-- Spanish Flag Accent Band -->
    <rect x="4" y="26" width="56" height="3" fill="#DC2626" />
    <rect x="4" y="29" width="56" height="6" fill="#FBBF24" />
    <rect x="4" y="35" width="56" height="3" fill="#DC2626" />

    <!-- Central Shield -->
    <path d="M 18 20 Q 32 18 46 20 C 46 32 42 44 32 48 C 22 44 18 32 18 20 Z" 
          fill="url(#hlShieldGrad)" stroke="url(#hlGoldGrad)" stroke-width="1.5" />

    <!-- Stylized Wings -->
    <path d="M 23 28 C 26 25 30 24 32 24 C 34 24 38 25 41 28 C 39 30 37 31 32 31 C 27 31 25 30 23 28 Z" 
          fill="url(#hlGoldGrad)" />

    <!-- Text: ORERO -->
    <text x="32" y="41" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="10.5" 
          letter-spacing="0.12em" 
          fill="#FFFFFF" 
          text-anchor="middle">ORERO</text>

    <!-- Arc Texts -->
    <path id="hlUpperArc" d="M 10 32 A 22 22 0 0 1 54 32" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="4.4" fill="#FFFFFF" letter-spacing="0.18em">
      <textPath href="#hlUpperArc" startOffset="50%" text-anchor="middle">
        MOTORCYCLE STORE
      </textPath>
    </text>

    <path id="hlLowerArc" d="M 54 32 A 22 22 0 0 1 10 32" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="4.2" fill="#FBBF24" letter-spacing="0.15em">
      <textPath href="#hlLowerArc" startOffset="50%" text-anchor="middle">
        ORIHUELA · 1998
      </textPath>
    </text>
  </g>

  <!-- Typography Lockup (Right) -->
  <g transform="translate(80, 6)">
    <!-- Brand Title with inline tspan to eliminate any collision -->
    <text x="0" y="30" 
          font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="0.04em" 
          fill="#0A1128">MOTORCYCLE STORE <tspan fill="#E8431A" font-weight="900">ORERO</tspan></text>

    <!-- Subtitle / Badges -->
    <text x="1" y="50" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="11" 
          letter-spacing="0.14em" 
          fill="#475569">
      CONCESIONARIO MULTIMARCA Y TALLER · ORIHUELA
    </text>
  </g>
</svg>