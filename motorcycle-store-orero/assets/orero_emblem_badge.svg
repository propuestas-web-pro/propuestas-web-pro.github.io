<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <circle cx="50" cy="50" r="46" fill="#0A0F1D" stroke="url(#goldRing)" stroke-width="3" />
    <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />

    <!-- Spanish Flag Tricolor Center Ribbon -->
    <g opacity="0.95">
      <rect x="8" y="40" width="84" height="5" fill="#DC2626" />
      <rect x="8" y="45" width="84" height="10" fill="#FBBF24" />
      <rect x="8" y="55" width="84" height="5" fill="#DC2626" />
    </g>

    <!-- Central Crest Shield -->
    <path d="M 30 32 Q 50 29 70 32 C 70 50 64 66 50 72 C 36 66 30 50 30 32 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Stylized Motorcycle Silhouette -->
    <path d="M 37 45 C 41 39 47 38 50 38 C 53 38 59 39 63 45 C 60 48 57 49 50 49 C 43 49 40 48 37 45 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Shield Text: ORERO -->
    <text x="50" y="63" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="15" 
          letter-spacing="0.12em" 
          fill="#FFFFFF" 
          text-anchor="middle">ORERO</text>

    <!-- Curved Upper Text: MOTORCYCLE STORE -->
    <path id="upperArc" d="M 18 50 A 32 32 0 0 1 82 50" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6" fill="#F8FAFC" letter-spacing="0.18em">
      <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
        MOTORCYCLE STORE
      </textPath>
    </text>

    <!-- Curved Lower Text: ORIHUELA · EST. 1998 -->
    <path id="lowerArc" d="M 82 50 A 32 32 0 0 1 18 50" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5.8" fill="#FBBF24" letter-spacing="0.15em">
      <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
        ORIHUELA · EST. 1998
      </textPath>
    </text>

    <!-- Stars -->
    <circle cx="15" cy="50" r="1.5" fill="#FBBF24" />
    <circle cx="85" cy="50" r="1.5" fill="#FBBF24" />
  </g>
</svg>
