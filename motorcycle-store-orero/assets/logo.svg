<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#003b8e"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield / Hexagon Base -->
    <path d="M30 0 L55 12 L55 42 L30 58 L5 42 L5 12 Z" fill="url(#blueGrad)" stroke="#0284c7" stroke-width="2"/>
    <path d="M30 4 L51 14 L51 40 L30 53 L9 40 L9 14 Z" fill="#002b66" opacity="0.6"/>
    
    <!-- Stylized Motorcycle Silhouette -->
    <!-- Rear Wheel -->
    <circle cx="18" cy="38" r="9" stroke="url(#silverGrad)" stroke-width="2.5" fill="none"/>
    <circle cx="18" cy="38" r="4" fill="#0284c7"/>
    
    <!-- Front Wheel -->
    <circle cx="42" cy="38" r="9" stroke="url(#silverGrad)" stroke-width="2.5" fill="none"/>
    <circle cx="42" cy="38" r="4" fill="#0284c7"/>
    
    <!-- Frame / Body Streamline -->
    <path d="M18 38 L25 28 L34 28 L42 38 M25 28 L32 20 L38 22 M32 20 L30 16 L35 15" stroke="url(#silverGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M26 26 L36 26 L33 32 L24 32 Z" fill="#0284c7"/>
    <circle cx="37" cy="22" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(78, 22)">
    <text x="0" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" fill="#002b66" letter-spacing="-0.5">
      MOTORCYCLE STORE
    </text>
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#0284c7" letter-spacing="3">
      ORERO
    </text>
    <text x="96" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="1.5">
      · CONCESIONARIO &amp; TALLER
    </text>
  </g>
</svg>
