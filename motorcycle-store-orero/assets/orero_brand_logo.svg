<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ================= EMBLEM SEAL (x: 4 to 72, cy: 38, r: 34) ================= -->
  <g transform="translate(6, 4)" filter="url(#badgeShadow)">
    <!-- Outer Rim -->
    <circle cx="34" cy="34" r="33" fill="#0A0F1D" stroke="url(#goldRing)" stroke-width="2" />
    <circle cx="34" cy="34" r="30.5" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="0.75" />

    <!-- Spanish Flag Tricolor Center Ribbon -->
    <g opacity="0.95">
      <rect x="5" y="27" width="58" height="3.5" fill="#DC2626" />
      <rect x="5" y="30.5" width="58" height="7" fill="#FBBF24" />
      <rect x="5" y="37.5" width="58" height="3.5" fill="#DC2626" />
    </g>

    <!-- Central Crest Shield -->
    <path d="M 20 22 Q 34 20 48 22 C 48 34 44 46 34 50 C 24 46 20 34 20 22 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Stylized Motorcycle Silhouette / Wings -->
    <path d="M 25 31 C 28 27 32 26 34 26 C 36 26 40 27 43 31 C 41 33 39 34 34 34 C 29 34 27 33 25 31 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Shield Text: ORERO -->
    <text x="34" y="44" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="10.5" 
          letter-spacing="0.12em" 
          fill="#FFFFFF" 
          text-anchor="middle">ORERO</text>

    <!-- Curved Upper Text: MOTORCYCLE STORE -->
    <path id="upperArc" d="M 12 34 A 22 22 0 0 1 56 34" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="4.2" fill="#F8FAFC" letter-spacing="0.18em">
      <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
        MOTORCYCLE STORE
      </textPath>
    </text>

    <!-- Curved Lower Text: ORIHUELA · 1998 -->
    <path id="lowerArc" d="M 56 34 A 22 22 0 0 1 12 34" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="4" fill="#FBBF24" letter-spacing="0.15em">
      <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
        ORIHUELA · EST. 1998
      </textPath>
    </text>

    <!-- Tiny Stars -->
    <circle cx="10" cy="34" r="1" fill="#FBBF24" />
    <circle cx="58" cy="34" r="1" fill="#FBBF24" />
  </g>

  <!-- ================= TYPOGRAPHY (Horizontal Lockup) ================= -->
  <g transform="translate(86, 0)">
    <!-- Line 1: MOTORCYCLE STORE -->
    <text x="0" y="27" 
          font-family="'Barlow Condensed', sans-serif" 
          font-weight="800" 
          font-size="20" 
          letter-spacing="0.08em" 
          fill="#0F172A">
      MOTORCYCLE STORE
    </text>

    <!-- Line 2: ORERO (in vibrant racing red) -->
    <text x="178" y="27" 
          font-family="'Barlow Condensed', sans-serif" 
          font-weight="900" 
          font-size="20" 
          letter-spacing="0.06em" 
          fill="#E8431A">
      ORERO
    </text>

    <!-- Line 3: Official Dealer Subtitle -->
    <text x="0" y="47" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="9.5" 
          letter-spacing="0.18em" 
          fill="#475569">
      CONCESIONARIO OFICIAL · ORIHUELA
    </text>

    <!-- Official Brand Badges Row -->
    <g transform="translate(0, 56)">
      <!-- KYMCO Official -->
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.75" />
      <text x="23" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#DC2626" text-anchor="middle">KYMCO</text>

      <!-- QJ MOTOR Official -->
      <rect x="52" y="0" width="56" height="15" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.75" />
      <text x="80" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#0F172A" text-anchor="middle">QJ MOTOR</text>

      <!-- RIEJU Official -->
      <rect x="114" y="0" width="44" height="15" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.75" />
      <text x="136" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#DC2626" text-anchor="middle">RIEJU</text>

      <!-- MACBOR Official -->
      <rect x="164" y="0" width="50" height="15" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.75" />
      <text x="189" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#0F172A" text-anchor="middle">MACBOR</text>

      <!-- 1 Año Garantía -->
      <rect x="220" y="0" width="88" height="15" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.75" />
      <text x="264" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#059669" text-anchor="middle">✓ TALLER OFICIAL</text>
    </g>
  </g>
</svg>
