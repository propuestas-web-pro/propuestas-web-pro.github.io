<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Motorcycle Store Orero</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      --bg: #ffffff;
      --tx: #0f172a;
      --mu: #475569;
      --ac: #c2410c;
      --navy: #0a1128;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 540px;
      padding: 40px 32px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      background: #fff7ed;
      color: var(--ac);
      border: 1px solid #fed7aa;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.2rem;
      color: var(--navy);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--mu);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--navy);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1e293b;
    }
    .btn-outline {
      background: #ffffff;
      color: var(--ac);
      border: 2px solid var(--ac);
    }
    .btn-outline:hover {
      background: #fff7ed;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Error 404</span>
    <h1>Página no encontrada</h1>
    <p>La sección o ficha que buscas no existe o ha sido trasladada. Puedes volver al catálogo de motos o llamarnos directamente para cualquier consulta.</p>
    <div class="actions">
      <a href="/motorcycle-store-orero/" class="btn btn-primary">Ver catálogo de motos</a>
      <a href="tel:+34966740120" class="btn btn-outline">Llamar al 966 74 01 20</a>
    </div>
  </main>
</body>
</html>
